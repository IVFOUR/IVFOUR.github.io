name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm --prefix portfolio run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm --prefix portfolio run verify
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio/public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
